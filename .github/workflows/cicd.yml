name: CI/CD - Build, Push & Deploy

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - "scripts/**"
      - ".github/workflows/cicd.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: sajedul5/webapp-demo

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./webapp
          push: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.short_sha }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/devops-demo.pem
          chmod 600 ~/.ssh/devops-demo.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy deploy script to EC2
        run: |
          scp -i ~/.ssh/devops-demo.pem scripts/deploy.sh \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/deploy.sh

      - name: Run deploy script (pull new image, stop/remove old, run new)
        run: |
          ssh -i ~/.ssh/devops-demo.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "chmod +x ~/deploy.sh && ~/deploy.sh ${{ env.IMAGE_NAME }} ${{ needs.build-and-push.outputs.short_sha }}"

      - name: Verify from runner
        run: |
          sleep 3
          curl -fsS "http://${{ secrets.EC2_HOST }}:8080/health"
          echo "🚀 Live at http://${{ secrets.EC2_HOST }}:8080"

      - name: Cleanup key
        if: always()
        run: rm -f ~/.ssh/devops-demo.pem
